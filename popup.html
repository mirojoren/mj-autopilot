<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      width: 320px;
      background: #1f1f23;
      color: #e6e6e6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .wrap { padding: 20px; }
    h1 { font-size: 16px; margin: 0 0 6px; font-weight: 600; }
    .sub { font-size: 13px; color: #999; margin: 0 0 16px; line-height: 1.5; }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #6c5ce7;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      box-sizing: border-box;
    }
    .btn:hover { filter: brightness(1.1); }
    .tip { font-size: 12px; color: #777; margin-top: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>MJ Autopilot</h1>
    <p class="sub">Midjourney 网页版批量队列 · 翻译 · 下载 · 图生词</p>
    <a class="btn" id="open-site" href="https://www.midjourney.com" target="_blank" rel="noopener">打开 Midjourney 网页版</a>
    <p class="tip">在 Midjourney 网页版页面右下角，点击紫色圆形按钮即可打开操作面板。</p>
  </div>
</body>
</html>
